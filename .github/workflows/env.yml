name: environment-up-down

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Which environment"
        type: choice
        options: [staging, prod]
        default: staging
      action:
        description: "up = terraform apply, down = terraform destroy"
        type: choice
        options: [up, down]
        default: up

permissions:
  contents: read
  id-token: write

env:
  TF_VERSION: "1.16.7"

jobs:
  run:
    name: ${{ inputs.action }} ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment == 'prod' && 'production' || 'staging' }}
    concurrency: tf-${{ inputs.environment }}
    defaults:
      run:
        working-directory: envs/${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1
      - run: terraform init -input=false
      - name: up (apply)
        if: inputs.action == 'up'
        run: terraform apply -input=false -auto-approve
      - name: down (destroy)
        if: inputs.action == 'down'
        run: terraform destroy -input=false -auto-approve
