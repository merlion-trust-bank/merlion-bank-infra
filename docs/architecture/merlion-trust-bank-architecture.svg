<svg xmlns="http://www.w3.org/2000/svg" width="3200" height="2200" viewBox="0 0 1600 1100" font-family="Segoe UI, Arial, sans-serif">
<title>Merlion Trust Bank architecture (us-east-1)</title>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#2B2F33"/></marker>
<marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#B8323A"/></marker>
<style>
.box{fill:#FFFFFF;stroke:#B9BEC4;stroke-width:1}
.frame{fill:#FFFFFF;stroke:#5B6168;stroke-width:1.3}
.band{fill:#EDF1F4;stroke:none}
.grp{fill:none;stroke:#A9B0B7;stroke-width:1;stroke-dasharray:4 3}
.teal{fill:#E3F2F1;stroke:#2F7E7A;stroke-width:1.3}
.red{fill:#FBE9E9;stroke:#B8323A;stroke-width:1.5}
.t{font-size:15px;font-weight:600;fill:#1F2328}
.t2{font-size:13.5px;font-weight:600;fill:#1F2328}
.tt{font-size:14.5px;font-weight:600;fill:#1F4E4C}
.st{font-size:12.5px;fill:#2F7E7A}
.s{font-size:12.5px;fill:#4A5058}
.m{font-size:11px;font-family:Consolas, monospace;fill:#4A5058}
.arr{stroke:#2B2F33;stroke-width:1.3;fill:none}
.rarr{stroke:#B8323A;stroke-width:1.5;fill:none}
</style>
</defs>
<rect width="1600" height="1100" fill="#FFFFFF"/>

<!-- Customers -->
<rect class="box" x="445" y="20" width="200" height="56" rx="4"/>
<text class="t" x="460" y="43">Customers</text>
<text class="s" x="460" y="63">Web browser</text>
<line class="arr" x1="545" y1="76" x2="545" y2="176" marker-end="url(#a)"/>
<text class="m" x="553" y="101">HTTPS 443</text>

<!-- Region boundary -->
<rect x="355" y="88" width="1220" height="967" rx="6" fill="none" stroke="#B8323A" stroke-width="1.8" stroke-dasharray="8 5"/>
<text x="965" y="115" text-anchor="middle" font-size="15" font-weight="600" fill="#B8323A">AWS us-east-1 (N. Virginia) · all customer data, backups and logs at rest</text>

<!-- ===== Left column: delivery ===== -->
<text class="m" x="30" y="108" font-size="12">DELIVERY · OUTSIDE AWS</text>

<rect class="box" x="30" y="125" width="300" height="58" rx="4"/>
<text class="t" x="45" y="149">Developers</text>
<text class="s" x="45" y="170">branch SCRUM-&lt;n&gt;-*, PR to main</text>
<line class="arr" x1="180" y1="183" x2="180" y2="203" marker-end="url(#a)"/>

<rect class="box" x="30" y="205" width="300" height="250" rx="4"/>
<text class="t" x="45" y="229">GitHub · merlion-trust-bank-sg</text>
<text class="s" x="45" y="249">Branch protection · 1 review · Jira SCRUM</text>
<rect class="box" x="45" y="262" width="270" height="85" rx="4"/>
<text class="t2" x="58" y="282">merlion-bank-app</text>
<text class="s" x="58" y="301">build → SCA → image scan → ECR</text>
<text class="s" x="58" y="319">dev auto → staging auto after tests</text>
<text class="s" x="58" y="337">production: manual approval</text>
<rect class="box" x="45" y="357" width="270" height="85" rx="4"/>
<text class="t2" x="58" y="377">merlion-bank-infra</text>
<text class="s" x="58" y="396">checkov → Terraform plan on PR</text>
<text class="s" x="58" y="414">apply dev → staging</text>
<text class="s" x="58" y="432">production: manual approval</text>
<line class="arr" x1="180" y1="455" x2="180" y2="478" marker-end="url(#a)"/>

<rect class="box" x="30" y="480" width="300" height="58" rx="4"/>
<text class="t" x="45" y="504">Security gates</text>
<text class="s" x="45" y="525">Fail build on HIGH / CRITICAL</text>
<line class="arr" x1="180" y1="538" x2="180" y2="561" marker-end="url(#a)"/>

<rect class="red" x="30" y="563" width="300" height="58" rx="4"/>
<text class="t" x="45" y="587">GitHub OIDC → AWS STS</text>
<text class="s" x="45" y="608">Short-lived creds, no stored keys</text>
<line class="rarr" x1="330" y1="592" x2="378" y2="592" marker-end="url(#r)"/>

<text class="s" x="30" y="645">gha-dev / gha-staging → own account only</text>
<text class="s" x="30" y="665">gha-prod → prod account, after approval</text>

<text class="m" x="30" y="705" font-size="12">NOTE</text>
<text class="s" x="30" y="725">CI run logs are stored by GitHub,</text>
<text class="s" x="30" y="743">outside AWS. Keep customer data</text>
<text class="s" x="30" y="761">and app logs out of CI output.</text>

<rect class="box" x="30" y="900" width="300" height="58" rx="4"/>
<text class="t" x="45" y="924">On-call engineer</text>
<text class="s" x="45" y="945">Email + Telegram alerts</text>

<!-- ===== Production account ===== -->
<rect class="frame" x="380" y="130" width="780" height="590" rx="4"/>
<text class="t" x="1145" y="152" text-anchor="end">Production account · VPC across 2 AZs (us-east-1a / 1b)</text>

<!-- Public subnets -->
<rect class="band" x="400" y="165" width="740" height="88"/>
<rect class="box" x="420" y="178" width="250" height="62" rx="4"/>
<text class="t" x="435" y="201">Application Load Balancer</text>
<text class="s" x="435" y="222">HTTPS 443 · ACM cert · LB Controller</text>
<text class="m" x="785" y="214" text-anchor="middle">PUBLIC SUBNETS</text>
<rect class="box" x="900" y="178" width="220" height="62" rx="4"/>
<text class="t" x="915" y="201">NAT gateway ×2</text>
<text class="s" x="915" y="222">one per AZ · egress only</text>

<!-- EKS private subnets -->
<rect class="band" x="400" y="268" width="740" height="292"/>
<text class="t" x="560" y="292">Amazon EKS · private subnets</text>
<text class="s" x="560" y="312">add-ons: LB Controller · External Secrets (IRSA) · monitoring stack (below)</text>
<text class="m" x="1132" y="292" text-anchor="end">pull · secrets</text>
<line class="arr" x1="545" y1="240" x2="545" y2="398" marker-end="url(#a)"/>

<rect class="teal" x="440" y="400" width="185" height="58" rx="4"/>
<text class="tt" x="453" y="423">frontend</text>
<text class="st" x="453" y="444">Python · 2+ replicas</text>

<rect class="box" x="415" y="478" width="160" height="52" rx="4"/>
<text class="t2" x="427" y="498">VPC endpoints</text>
<text class="s" x="427" y="517" font-size="11.5">ECR, S3, SM, Logs, STS</text>

<rect class="grp" x="650" y="335" width="205" height="162" rx="4"/>
<text class="m" x="662" y="352">ACCOUNTS</text>
<rect class="teal" x="662" y="360" width="181" height="56" rx="4"/>
<text class="tt" x="674" y="382">userservice</text>
<text class="st" x="674" y="401">Python · signs JWTs</text>
<rect class="teal" x="662" y="426" width="181" height="56" rx="4"/>
<text class="tt" x="674" y="448">contacts</text>
<text class="st" x="674" y="467">Python</text>
<line class="arr" x1="625" y1="429" x2="648" y2="429" marker-end="url(#a)"/>
<text class="m" x="627" y="421">JWT</text>

<rect class="grp" x="880" y="335" width="245" height="210" rx="4"/>
<text class="m" x="892" y="352">LEDGER</text>
<rect class="teal" x="892" y="360" width="221" height="54" rx="4"/>
<text class="tt" x="904" y="381">ledgerwriter</text>
<text class="st" x="904" y="400">Java · validates and writes txns</text>
<rect class="teal" x="892" y="422" width="221" height="54" rx="4"/>
<text class="tt" x="904" y="443">balancereader</text>
<text class="st" x="904" y="462">Java · balance cache</text>
<rect class="teal" x="892" y="484" width="221" height="54" rx="4"/>
<text class="tt" x="904" y="505">transactionhistory</text>
<text class="st" x="904" y="524">Java · history cache</text>

<path class="arr" d="M600 458 L600 530 L878 530" marker-end="url(#a)"/>
<text class="m" x="760" y="523">REST + JWT</text>

<!-- Isolated DB subnets -->
<rect class="band" x="400" y="575" width="740" height="128"/>
<text class="m" x="415" y="625">ISOLATED DB SUBNETS</text>
<text class="m" x="415" y="643">no internet route</text>
<rect class="box" x="630" y="600" width="240" height="92" rx="4"/>
<text class="t" x="643" y="621">RDS PostgreSQL</text>
<text class="s" x="643" y="640">accounts-db · Multi-AZ · KMS</text>
<text class="s" x="643" y="657">TLS · automated backups</text>
<text class="s" x="643" y="674">in-region only, no cross-region copy</text>
<rect class="box" x="890" y="600" width="240" height="92" rx="4"/>
<text class="t" x="903" y="621">RDS PostgreSQL</text>
<text class="s" x="903" y="640">ledger-db · Multi-AZ · KMS</text>
<text class="s" x="903" y="657">TLS · automated backups</text>
<text class="s" x="903" y="674">in-region only, no cross-region copy</text>

<line class="arr" x1="752" y1="497" x2="752" y2="598" marker-end="url(#a)"/>
<text class="m" x="760" y="569">SQL · TLS</text>
<line class="arr" x1="1000" y1="545" x2="1000" y2="598" marker-end="url(#a)"/>
<text class="m" x="1008" y="569">SQL · TLS</text>

<!-- EKS to platform services -->
<line class="arr" x1="1140" y1="300" x2="1194" y2="462" marker-end="url(#a)"/>
<line class="arr" x1="1140" y1="320" x2="1194" y2="522" marker-end="url(#a)"/>

<!-- ===== Right column ===== -->
<rect class="frame" x="1180" y="130" width="380" height="250" rx="4"/>
<text class="t" x="1195" y="154">Non-production · separate accounts</text>
<rect class="box" x="1195" y="168" width="350" height="98" rx="4"/>
<text class="t" x="1208" y="189">Development account</text>
<text class="s" x="1208" y="209">EKS + RDS single-AZ, smallest sizes</text>
<text class="s" x="1208" y="227">Auto-deploy on merge to main</text>
<text class="s" x="1208" y="245">Nodes → 0 and RDS stopped overnight</text>
<rect class="box" x="1195" y="274" width="350" height="98" rx="4"/>
<text class="t" x="1208" y="295">Staging account</text>
<text class="s" x="1208" y="315">Prod-like sizing, same Terraform modules</text>
<text class="s" x="1208" y="333">Same image digest promoted after dev tests</text>
<text class="s" x="1208" y="351">loadgenerator · synthetic data only</text>

<rect class="frame" x="1180" y="400" width="380" height="320" rx="4"/>
<text class="t" x="1195" y="424">Production platform services</text>
<rect class="box" x="1195" y="438" width="350" height="50" rx="4"/>
<text class="t" x="1208" y="458">Amazon ECR</text>
<text class="s" x="1208" y="477">Immutable tags · scan on push · cross-account pull</text>
<rect class="box" x="1195" y="498" width="350" height="50" rx="4"/>
<text class="t" x="1208" y="518">Secrets Manager</text>
<text class="s" x="1208" y="537">DB creds, JWT key pair → pods (External Secrets)</text>
<rect class="box" x="1195" y="558" width="350" height="50" rx="4"/>
<text class="t" x="1208" y="578">AWS KMS</text>
<text class="s" x="1208" y="597">CMKs for RDS, S3, logs, secrets</text>
<rect class="red" x="1195" y="618" width="350" height="90" rx="4"/>
<text class="t" x="1208" y="640">gha-prod role + Terraform state</text>
<text class="s" x="1208" y="660">Trust: repo + environment production only</text>
<text class="s" x="1208" y="678">State: S3 per account · versioned · KMS</text>

<!-- ===== Observability ===== -->
<line class="arr" x1="600" y1="560" x2="600" y2="776"/>
<path class="arr" d="M600 776 L486 776 L486 788" marker-end="url(#a)"/>
<text class="m" x="608" y="733">logs + metrics</text>

<rect class="frame" x="380" y="740" width="780" height="300" rx="4"/>
<text class="t" x="395" y="765">Observability · self-hosted on EKS in us-east-1, no third-party SaaS</text>
<rect class="box" x="400" y="790" width="172" height="70" rx="4"/>
<text class="t" x="412" y="812">Loki + Promtail</text>
<text class="s" x="412" y="832">logs from all pods</text>
<text class="s" x="412" y="850">365-day retention</text>
<rect class="box" x="587" y="790" width="172" height="70" rx="4"/>
<text class="t" x="599" y="812">Prometheus</text>
<text class="s" x="599" y="832">node, pod, app metrics</text>
<text class="s" x="599" y="850">+ ALB via YACE exporter</text>
<rect class="box" x="774" y="790" width="172" height="70" rx="4"/>
<text class="t" x="786" y="812">Grafana</text>
<text class="s" x="786" y="832">Health, SLOs, logs</text>
<text class="s" x="786" y="850">for non-team viewers</text>
<rect class="red" x="961" y="790" width="172" height="70" rx="4"/>
<text class="t" x="973" y="812">Alertmanager</text>
<text class="s" x="973" y="832">SLO rules: avail., p95</text>
<text class="s" x="973" y="850">→ email / Telegram</text>

<text class="s" x="400" y="900">SLIs: availability = 1 − ALB 5xx ratio (SLO 99.9%)</text>
<text class="s" x="400" y="920">latency = p95 ALB target response time (SLO &lt; 500 ms)</text>
<text class="s" x="400" y="950">Storage: Loki chunks → S3 bucket (us-east-1, KMS) · Prometheus → EBS volume</text>
<text class="s" x="400" y="970">Stack: kube-prometheus-stack + Loki Helm charts in namespace monitoring</text>

<path class="rarr" d="M1047 860 L1047 1015 L180 1015 L180 961" marker-end="url(#r)"/>
<text class="m" x="430" y="1008">Alertmanager → email / Telegram · alert text contains no customer data</text>

<!-- ===== Audit ===== -->
<rect class="frame" x="1180" y="740" width="380" height="300" rx="4"/>
<text class="t" x="1195" y="764">Audit · tamper-resistant</text>
<rect class="box" x="1195" y="780" width="350" height="58" rx="4"/>
<text class="t" x="1208" y="802">CloudTrail (all 3 accounts)</text>
<text class="s" x="1208" y="822">Every API call, incl. OIDC role sessions</text>
<line class="arr" x1="1370" y1="838" x2="1370" y2="866" marker-end="url(#a)"/>
<rect class="red" x="1195" y="868" width="350" height="58" rx="4"/>
<text class="t" x="1208" y="890">S3 Object Lock bucket (log-archive)</text>
<text class="s" x="1208" y="910">Compliance mode · 1-year retention</text>
<text class="s" x="1195" y="960">Also stores EKS audit logs (via Firehose)</text>
<text class="s" x="1195" y="978">and pipeline deploy records (who, what, when).</text>

<!-- Footer -->
<line x1="0" y1="1068" x2="1600" y2="1068" stroke="#D5D9DD" stroke-width="1"/>
<text class="s" x="20" y="1088"><tspan fill="#B8323A" font-weight="600">Red</tspan> marks the us-east-1 data boundary and every point where a credential or approval controls access to production. <tspan fill="#2F7E7A" font-weight="600">Teal</tspan> boxes are the six Bank of Anthos services built from upstream source into our own images.</text>
</svg>
