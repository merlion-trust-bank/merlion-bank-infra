name: terraform-pr

on:
  pull_request:
    paths: ["envs/**", "modules/**", ".github/workflows/tf-*.yml"]

permissions:
  contents: read
  id-token: write        # OIDC token for AWS
  pull-requests: write   # post plan as a PR comment

env:
  TF_VERSION: "1.16.7"

jobs:
  checks:
    name: fmt / validate / security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform fmt
        run: terraform fmt -check -recursive

      - name: terraform validate (both envs)
        run: |
          for env in staging prod; do
            terraform -chdir=envs/$env init -backend=false -input=false
            terraform -chdir=envs/$env validate
          done

      - name: Trivy IaC scan (fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          trivyignores: .trivyignore

  plan-staging:
    name: plan (staging)
    needs: checks
    runs-on: ubuntu-latest
    environment: staging
    defaults:
      run:
        working-directory: envs/staging
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1
      - run: terraform init -input=false
      - run: terraform plan -input=false -no-color -out=tfplan
      - run: terraform show -no-color tfplan > plan.txt
      - name: Comment plan on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('envs/staging/plan.txt', 'utf8');
            const summary = (plan.match(/(Plan:.*|No changes\..*)/) || ['(see log)'])[0];
            const body = `### Terraform plan · staging\n**${summary}**\n<details><summary>Full plan</summary>\n\n\`\`\`\n${plan.slice(-60000)}\n\`\`\`\n</details>`;
            await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
